<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2530">
<title>Unwim AI</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F7F6; --surface: #FFFFFF; --ink: #0B2530; --muted: #587480; --line: #D5E3E2;
    --brand: #14566B; --userBg: #14566B; --userText: #F2F7F6;
    --accent: #DCE62E; --accentInk: #1B2200; --focus: #3A2BF0; --chip: #E1EDEC;
    --ringA: #12C8D6; --ringB: #3A2BF0; --ringC: #0A9B0A; --showL: block; --showD: none;
    --codeBg: #0B2530; --codeText: #D9EEF0; --codeMuted: #8FB3BC; --err: #B42318;
    --shadow: 0 10px 30px -14px rgba(11, 37, 48, .35);
    --sans: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #061A22; --surface: #0C2631; --ink: #E6F2F2; --muted: #8FAAB3; --line: #17394A;
      --brand: #5CC3D8; --userBg: #1D7289; --userText: #FFFFFF; --chip: #12313E;
      --codeBg: #04121A; --err: #FF8A7A; --shadow: 0 10px 30px -14px rgba(0, 0, 0, .7);
      --focus: #5CE1EE; --ringB: #8A80FF; --ringC: #4CC24C; --showL: none; --showD: block;
    }
  }
  :root[data-theme="dark"] {
    --bg: #061A22; --surface: #0C2631; --ink: #E6F2F2; --muted: #8FAAB3; --line: #17394A;
    --brand: #5CC3D8; --userBg: #1D7289; --userText: #FFFFFF; --chip: #12313E;
    --codeBg: #04121A; --err: #FF8A7A; --shadow: 0 10px 30px -14px rgba(0, 0, 0, .7);
    --focus: #5CE1EE; --ringB: #8A80FF; --ringC: #4CC24C; --showL: none; --showD: block;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; height: 100dvh; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .logo { height: auto; }
  .logo-l { display: var(--showL); }
  .logo-d { display: var(--showD); }
  svg { display: block; }

  /* ---- Header ---- */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 20px; padding-top: max(12px, env(safe-area-inset-top));
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand { gap: 8px; }
  .brand .logo { width: 82px; }
  .brand .ai { font-weight: 700; font-size: 20px; letter-spacing: -.01em; color: var(--muted); padding-top: 4px; }
  .tools { display: flex; align-items: center; gap: 4px; }
  .tool {
    display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px;
    border: 0; background: transparent; border-radius: 12px; color: var(--muted); font-size: 15px;
  }
  .tool:hover { background: var(--chip); color: var(--ink); }
  .tool svg { width: 19px; height: 19px; }
  .tool[hidden] { display: none; }

  /* ---- Log ---- */
  #log { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .col { max-width: 720px; margin: 0 auto; padding: 4px 20px 28px; }

  /* ---- Mark (tanda riak) ---- */
  .mark .r { fill: none; stroke-width: 2.6; transform-box: fill-box; transform-origin: center; }
  .mark .r1 { stroke: var(--ringA); opacity: .95; }
  .mark .r2 { stroke: var(--ringB); opacity: .7; }
  .mark .r3 { stroke: var(--ringC); opacity: .5; }
  .mark .dot { fill: var(--accent); }
  .thinking .mark .r { animation: ripple 1.9s ease-out infinite; }
  .thinking .mark .r2 { animation-delay: .3s; }
  .thinking .mark .r3 { animation-delay: .6s; }
  @keyframes ripple {
    0% { transform: scale(.45); opacity: 0; }
    30% { opacity: .95; }
    100% { transform: scale(1.12); opacity: 0; }
  }
  .hero .logo { animation: rise .9s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.96); } }

  /* ---- Hero (kondisi kosong) ---- */
  .hero { margin-top: clamp(20px, 9vh, 90px); }
  .hero .logo { width: min(250px, 62vw); margin: 0 0 24px -6px; }
  .hero h1 { margin: 0 0 12px; font-size: clamp(34px, 7vw, 54px); line-height: 1.04; letter-spacing: -.025em; font-weight: 700; }
  .hero p { margin: 0; max-width: 40ch; color: var(--muted); font-size: 18px; line-height: 1.5; }
  .ideas { margin-top: 34px; border-top: 1px solid var(--line); }
  .idea {
    display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%;
    text-align: left; padding: 15px 6px; background: transparent; border: 0; border-bottom: 1px solid var(--line);
    font-size: 17px; color: var(--ink); border-radius: 0;
  }
  .idea svg { width: 18px; height: 18px; color: var(--muted); flex: none; transition: transform .15s; }
  .idea:hover { background: var(--chip); }
  .idea:hover svg { transform: translateX(3px); color: var(--ink); }

  /* ---- Pesan ---- */
  .row { margin: 22px 0; }
  .row.user { display: flex; justify-content: flex-end; }
  .bubble {
    max-width: 85%; padding: 10px 16px; border-radius: 20px 20px 6px 20px; background: var(--userBg);
    color: var(--userText); font-size: 16px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .row.bot { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 14px; }
  .row.bot .mark { width: 32px; height: 32px; margin-top: 2px; }
  .body { font-family: var(--serif); font-size: 17.5px; line-height: 1.7; max-width: 68ch; overflow-wrap: anywhere; }
  .body > :first-child { margin-top: 0; }
  .body p { margin: 0 0 .9em; }
  .body h2, .body h3, .body h4, .body h5 { font-family: var(--sans); font-weight: 700; letter-spacing: -.01em; line-height: 1.25; margin: 1.5em 0 .5em; }
  .body h2 { font-size: 1.4em; } .body h3 { font-size: 1.22em; } .body h4, .body h5 { font-size: 1.08em; }
  .body ul, .body ol { margin: 0 0 .9em; padding-left: 1.35em; }
  .body li { margin: .3em 0; padding-left: .2em; }
  .body li::marker { color: var(--brand); }  .body a { color: var(--brand); text-underline-offset: 3px; }
  .body blockquote { margin: 0 0 .9em; padding: 2px 0 2px 16px; border-left: 3px solid var(--accent); color: var(--muted); }
  .body hr { border: 0; border-top: 1px solid var(--line); margin: 1.4em 0; }
  .body code { font-family: var(--mono); font-size: .86em; }
  .body :not(pre) > code { background: var(--chip); padding: 2px 6px; border-radius: 6px; }
  .tw { overflow-x: auto; margin: 0 0 1em; }
  .body table { border-collapse: collapse; font-family: var(--sans); font-size: 15px; min-width: 100%; }
  .body th, .body td { text-align: left; padding: 9px 14px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .body th { font-weight: 700; border-bottom-color: var(--brand); }
  .code { background: var(--codeBg); border-radius: 14px; margin: 1em 0; overflow: hidden; }
  .code-head {
    display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 6px 16px;
    font-family: var(--sans); font-size: 13px; color: var(--codeMuted); border-bottom: 1px solid rgba(143, 179, 188, .18);
  }
  .code-head button { background: transparent; border: 0; color: var(--codeMuted); padding: 4px 10px; border-radius: 8px; font-size: 13px; }
  .code-head button:hover { background: rgba(143, 179, 188, .16); color: #fff; }
  .code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.6; }
  .code code { color: var(--codeText); font-size: inherit; }
  .actions { margin-top: 4px; display: flex; gap: 2px; }
  .ghost {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border: 0; background: transparent;
    color: var(--muted); border-radius: 9px; font-size: 13.5px;
  }
  .ghost:hover { background: var(--chip); color: var(--ink); }
  .ghost svg { width: 15px; height: 15px; }
  .err {
    margin: 18px 0; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line);
    border-left: 4px solid var(--err); border-radius: 12px; font-size: 15px; line-height: 1.5;
  }

  /* ---- Kotak tulis ---- */
  .dock { padding: 0 16px max(14px, env(safe-area-inset-bottom)); }
  .composer {
    max-width: 720px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 26px;
    padding: 7px 7px 7px 20px; box-shadow: var(--shadow); transition: border-color .15s;
  }
  .composer:focus-within { border-color: var(--brand); box-shadow: var(--shadow), 0 0 0 3px color-mix(in srgb, var(--focus) 28%, transparent); }
  textarea:focus-visible { outline: 0; }
  textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink);
    font: inherit; font-size: 16.5px; line-height: 1.45; padding: 9px 0; max-height: 180px;
  }
  textarea::placeholder { color: var(--muted); }
  .go {
    flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; display: grid; place-items: center;
    background: var(--accent); color: var(--accentInk); transition: transform .12s, opacity .12s;
  }
  .go:hover:not(:disabled) { transform: scale(1.06); }
  .go:disabled { opacity: .4; cursor: not-allowed; }
  .go.stop { background: var(--ink); color: var(--bg); }
  .go svg { width: 20px; height: 20px; }
  .go[hidden] { display: none; }
  .note { max-width: 720px; margin: 8px auto 0; text-align: center; font-size: 12.5px; color: var(--muted); }

  @media (max-width: 520px) {
    header { padding-left: 14px; padding-right: 10px; }
    .tool .t { display: none; }
    .tool { padding: 0 10px; }
    .col { padding-left: 16px; padding-right: 16px; }
    .row.bot { grid-template-columns: 26px minmax(0, 1fr); gap: 10px; }
    .row.bot .mark { width: 26px; height: 26px; }
    .body { font-size: 17px; }
    .bubble { max-width: 92%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<header>
  <div class="brand" id="brand" title=""><img class="logo logo-l" src="/logo.png" alt="Unwim" width="82" height="33"><img class="logo logo-d" src="/logo-dark.png" alt="" width="82" height="33"><span class="ai">AI</span></div>
  <div class="tools">
    <button class="tool" id="code" hidden aria-label="Masukkan kode akses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span class="t">Kode akses</span></button>
    <button class="tool" id="theme" aria-label="Ganti tema terang atau gelap"></button>
    <button class="tool" id="clear" aria-label="Mulai percakapan baru"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span class="t">Percakapan baru</span></button>
  </div>
</header>

<main id="log"><div class="col" id="wrap"></div></main>

<form class="dock" id="form">
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Tulis pesan untuk Unwim" aria-label="Pesan" autofocus></textarea>
    <button type="button" class="go stop" id="stop" hidden aria-label="Hentikan jawaban"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/></svg></button>
    <button type="submit" class="go" id="send" aria-label="Kirim pesan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button>
  </div>
  <div class="note">Unwim AI bisa keliru. Cek ulang hal yang penting.</div>
</form>

<script>
const $ = (id) => document.getElementById(id);
const wrap = $('wrap'), log = $('log'), input = $('input');
const KEY = 'unwim-history-v1';
let history = [];
let controller = null;
let accessCode = localStorage.getItem('unwim-access') || '';
try { history = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { history = []; }

const MARK = '<svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><circle class="r r3" cx="24" cy="24" r="21"/><circle class="r r2" cx="24" cy="24" r="14"/><circle class="r r1" cx="24" cy="24" r="7.5"/><circle class="dot" cx="24" cy="24" r="3.4"/></svg>';
const ICON = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>',
  go: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>',
};
const LOGO = '<img class="logo logo-l" src="/logo.png" alt="Unwim" width="352" height="143"><img class="logo logo-d" src="/logo-dark.png" alt="" width="352" height="143">';

const IDEAS = [
  'Rangkum teks panjang jadi poin-poin penting',
  'Bantu tulis email permohonan yang sopan',
  'Jelaskan konsep yang sulit, seolah saya baru belajar',
  'Cari kesalahan di kode saya',
];

/* ---- Tema ---- */
function isDark() {
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}
function paintTheme() { $('theme').innerHTML = isDark() ? ICON.sun : ICON.moon; }
try { const t = localStorage.getItem('unwim-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
$('theme').onclick = () => {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('unwim-theme', next); } catch {}
  paintTheme();
};
paintTheme();

/* ---- Markdown ringan (aman dari injeksi HTML) ---- */
function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function inline(raw) {
  let s = esc(raw);
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + codes[i] + '</code>');
}
function block(t) {
  const L = t.split('\n'); let out = '', i = 0;
  const isUl = (s) => /^\s*[-*+]\s+/.test(s), isOl = (s) => /^\s*\d+[.)]\s+/.test(s);
  const isH = (s) => /^#{1,4}\s+/.test(s), isQ = (s) => /^>\s?/.test(s), isT = (s) => s.trim().startsWith('|');
  const isHr = (s) => /^\s*([-*_])\1{2,}\s*$/.test(s);
  const starter = (s) => isUl(s) || isOl(s) || isH(s) || isQ(s) || isT(s) || isHr(s);
  const cells = (s) => s.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    if (isHr(l)) { out += '<hr>'; i++; continue; }
    if (isH(l)) { const m = l.match(/^(#{1,4})\s+(.*)$/); const n = m[1].length + 1; out += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (isUl(l)) { const it = []; while (i < L.length && isUl(L[i])) { it.push(L[i].replace(/^\s*[-*+]\s+/, '')); i++; } out += '<ul>' + it.map((x) => '<li>' + inline(x) + '</li>').join('') + '</ul>'; continue; }
    if (isOl(l)) { const it = []; while (i < L.length && isOl(L[i])) { it.push(L[i].replace(/^\s*\d+[.)]\s+/, '')); i++; } out += '<ol>' + it.map((x) => '<li>' + inline(x) + '</li>').join('') + '</ol>'; continue; }
    if (isQ(l)) { const it = []; while (i < L.length && isQ(L[i])) { it.push(L[i].replace(/^>\s?/, '')); i++; } out += '<blockquote>' + inline(it.join('\n')).replace(/\n/g, '<br>') + '</blockquote>'; continue; }
    if (isT(l) && i + 1 < L.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[i + 1])) {
      const head = cells(l); i += 2; const rows = [];
      while (i < L.length && isT(L[i])) { rows.push(cells(L[i])); i++; }
      out += '<div class="tw"><table><thead><tr>' + head.map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    const para = [l]; i++;
    while (i < L.length && L[i].trim() && !starter(L[i])) { para.push(L[i]); i++; }
    out += '<p>' + inline(para.join('\n')).replace(/\n/g, '<br>') + '</p>';
  }
  return out;
}
function codeBlock(p) {
  const nl = p.indexOf('\n');
  let lang = nl >= 0 ? p.slice(0, nl).trim() : '';
  let body = nl >= 0 ? p.slice(nl + 1) : p;
  if (!/^[\w+#.-]{1,20}$/.test(lang)) { if (lang) body = p; lang = ''; }
  return '<div class="code"><div class="code-head"><span>' + esc(lang) + '</span><button type="button" data-act="copy-code">Salin</button></div><pre><code>' + esc(body.replace(/\n$/, '')) + '</code></pre></div>';
}
function md(text) { return text.split('```').map((p, i) => (i % 2 ? codeBlock(p) : block(p))).join(''); }

/* ---- Tampilan ---- */
function save() { try { localStorage.setItem(KEY, JSON.stringify(history.slice(-40))); } catch {} }
function atBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 140; }
function toBottom() { log.scrollTop = log.scrollHeight; }

function userRow(text) {
  const r = document.createElement('div');
  r.className = 'row user';
  const b = document.createElement('div');
  b.className = 'bubble'; b.textContent = text;
  r.appendChild(b); wrap.appendChild(r);
}
function botRow(text, index) {
  const r = document.createElement('div');
  r.className = 'row bot';
  r.innerHTML = MARK + '<div><div class="body"></div><div class="actions"></div></div>';
  const body = r.querySelector('.body');
  if (text) body.innerHTML = md(text);
  if (index !== undefined) addActions(r, index);
  wrap.appendChild(r);
  return r;
}
function addActions(row, index) {
  row.querySelector('.actions').innerHTML = '<button type="button" class="ghost" data-act="copy-msg" data-i="' + index + '">' + ICON.copy + 'Salin jawaban</button>';
}
function hero() {
  const h = document.createElement('section');
  h.className = 'hero';
  h.innerHTML = LOGO + '<h1>Mau mulai dari mana?</h1><p>Tanya apa saja. Unwim menjawab dalam bahasa yang kamu pakai.</p><div class="ideas"></div>';
  const list = h.querySelector('.ideas');
  IDEAS.forEach((t) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'idea';
    b.innerHTML = '<span></span>' + ICON.go;
    b.firstChild.textContent = t;
    b.onclick = () => { input.value = t; input.dispatchEvent(new Event('input')); input.focus(); };
    list.appendChild(b);
  });
  wrap.appendChild(h);
}
function renderAll() {
  wrap.innerHTML = '';
  if (!history.length) return hero();
  history.forEach((m, i) => (m.role === 'user' ? userRow(m.content) : botRow(m.content, i)));
  toBottom();
}
function showError(msg) {
  const e = document.createElement('div');
  e.className = 'err'; e.setAttribute('role', 'alert'); e.textContent = msg;
  wrap.appendChild(e); toBottom();
}
function setBusy(b) {
  $('send').hidden = b; $('stop').hidden = !b; input.disabled = b;
  if (!b) input.focus();
}

/* ---- Kirim & terima ---- */
async function send(text) {
  history.push({ role: 'user', content: text });
  save(); renderAll();
  const row = botRow('');
  row.classList.add('thinking');
  const body = row.querySelector('.body');
  toBottom();
  let answer = '';
  controller = new AbortController();
  setBusy(true);

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      signal: controller.signal,
      headers: { 'Content-Type': 'application/json', 'X-Access-Code': accessCode },
      body: JSON.stringify({ messages: history }),
    });
    if (!res.ok) {
      let msg = 'Permintaan gagal (kode ' + res.status + ').';
      try { msg = (await res.json()).error || msg; } catch {}
      throw new Error(msg);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const data = t.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const delta = JSON.parse(data).choices?.[0]?.delta?.content;
          if (delta) {
            answer += delta;
            const stick = atBottom();
            body.innerHTML = md(answer);
            if (stick) toBottom();
          }
        } catch {}
      }
    }
    if (!answer) throw new Error('Penyedia AI mengirim jawaban kosong. Kirim ulang pesanmu.');
    history.push({ role: 'assistant', content: answer });
  } catch (e) {
    if (e.name === 'AbortError') {
      if (answer) history.push({ role: 'assistant', content: answer });
    } else {
      history.pop(); // pesan yang gagal dikembalikan ke kotak tulis
      input.value = text;
      input.dispatchEvent(new Event('input'));
      renderAll();
      showError(e.message);
      controller = null; setBusy(false);
      return;
    }
  }
  controller = null;
  save(); renderAll(); setBusy(false);
}

/* ---- Interaksi ---- */
async function copyText(text, btn, label) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch {}
    ta.remove();
  }
  const old = btn.innerHTML;
  btn.textContent = 'Tersalin';
  setTimeout(() => { btn.innerHTML = old; }, 1500);
}
wrap.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  if (b.dataset.act === 'copy-code') copyText(b.closest('.code').querySelector('code').textContent, b);
  if (b.dataset.act === 'copy-msg') copyText(history[Number(b.dataset.i)].content, b);
});
$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || controller) return;
  input.value = ''; input.style.height = 'auto';
  send(text);
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 180) + 'px';
});
$('stop').onclick = () => controller && controller.abort();
$('clear').onclick = () => { if (controller) controller.abort(); history = []; save(); renderAll(); input.focus(); };
$('code').onclick = () => {
  const v = prompt('Masukkan kode akses:', accessCode);
  if (v !== null) { accessCode = v.trim(); try { localStorage.setItem('unwim-access', accessCode); } catch {} }
};

fetch('/api/info').then((r) => r.json()).then((i) => {
  $('brand').title = i.model || '';
  if (i.needsCode) { $('code').hidden = false; if (!accessCode) $('code').click(); }
  if (!i.configured) showError('API_KEY belum diisi di server. Buka file .env dan isi API_KEY, lalu jalankan ulang server.');
}).catch(() => {});

renderAll();
</script>
</body>
</html>
